name: attendancetracker
description: A new Flutter project.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:       
    sdk: flutter 
  
  #Added Supabase Dependecy
  supabase_flutter: ^2.8.0
  
  sizer: ^2.0.15             
  flutter_svg: ^2.0.9      
  lottie: ^3.1.0
  google_fonts: ^6.1.0      
  shared_preferences: ^2.2.2 
  web: ^1.1.1
  

  cached_network_image: ^3.3.1
  connectivity_plus: ^6.1.4
  dio: ^5.4.0
  fluttertoast: ^8.2.4
  fl_chart: ^0.65.0
  flutter_slidable: ^4.0.3
  mobile_scanner: ^6.0.11
  permission_handler: ^11.1.0
  camera: ^0.10.5+5
  share_plus: ^12.0.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:  
    sdk: flutter 
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1 

flutter:
  uses-material-design: true 
  assets:
    - assets/images/DSCF5861.JPG
    - assets/images/
    - assets/images/Background_shooting_star.json

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logooo.png" 
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF" 
  adaptive_icon_foreground: "assets/images/logooo.png"
